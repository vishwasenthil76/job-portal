spring.application.name=backend
# Server
server.port=8080

# MongoDB
spring.data.mongodb.uri=mongodb://localhost:27017/jobportal
spring.data.mongodb.database=jobportal

# JWT
app.jwt.secret=your-256-bit-secret-key-replace-in-production-min-32-chars
app.jwt.expiration=86400000

# Mail (configure with your SMTP)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=your-email@gmail.com
spring.mail.password=your-app-password
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# File upload
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
app.upload.dir=uploads/

# CORS
app.cors.allowed-origins=http://localhost:3000

# Logging
logging.level.com.jobportal=DEBUG